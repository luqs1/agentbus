[package]
name = "agentbus"
version = "0.4.0"
edition = "2021"
description = "Peer-to-peer messaging between AI coding agents (Claude Code, Codex, OpenCode, pi): across your machines over Tailscale, and with other people over iroh"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2.11.1"
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
ureq = { version = "2", default-features = false, features = ["json"] }
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
